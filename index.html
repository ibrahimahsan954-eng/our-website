<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <script>
    /* Apply the saved theme before first paint to avoid a flash. Default = dark. */
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var dark = stored ? stored === "dark" : true;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Ebad Ahsan — video editor & motion designer. Premium product launch videos, explainers, demos, short-form reels, VSLs and keynote visuals — your story told in one powerful minute."
  />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Ebad Ahsan — Video Editor & Motion Designer</title>

  <!--
    Security: Content-Security-Policy — restricts scripts to this origin
    (plus Vite's dev-mode inline bootstrap) and locks down frames, media,
    connections, and fonts to the hosts the site actually uses. Mirrors the
    dev-server policy in vite.config.ts so development and production behave
    identically. X-Frame-Options for the HTML document itself is applied by
    the hosting edge; frame-ancestors 'none' is included here for any
    header-based deployment that picks this policy up.
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.cdnfonts.com; font-src 'self' https://fonts.gstatic.com https://fonts.cdnfonts.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' http: https: ws: wss:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://player.cloudinary.com https://cal.com https://app.cal.com https://calendly.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
  />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Social sharing previews -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Ebad Ahsan" />
  <meta property="og:title" content="Ebad Ahsan — Video Editor & Motion Designer" />
  <meta
    property="og:description"
    content="Video editor & motion designer. Premium product launch videos, explainers, demos, short-form reels and keynote visuals — your story told in one powerful minute."
  />
  <meta property="og:image" content="/logo.svg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Ebad Ahsan — Video Editor & Motion Designer" />
  <meta
    name="twitter:description"
    content="Video editor & motion designer. Premium product launch videos, explainers, demos, short-form reels and keynote visuals — your story told in one powerful minute."
  />

  <!-- Resource hints: warm up connections to video hosts/CDNs (thumbnails + embeds) -->
  <link rel="preconnect" href="https://www.youtube.com" />
  <link rel="preconnect" href="https://www.youtube-nocookie.com" />
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
  <link rel="preconnect" href="https://player.vimeo.com" />
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
