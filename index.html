<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <script>
    /* Apply the saved theme before first paint to avoid a flash. Default = dark. */
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var dark = stored ? stored === "dark" : true;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freelance Video Editor | Short Form & YouTube Content | editsbyebad</title>
  <meta
    name="description"
    content="Professional video editor specializing in short-form content, YouTube videos, and reels. Fast turnaround, affordable rates. Based in Pakistan."
  />
  <meta name="keywords" content="video editor Pakistan, freelance video editor, short form video editor, YouTube video editor, reels editor, TikTok editor, affordable video editing, professional video editor Karachi" />
  <meta name="theme-color" content="#0a0a0a" />

  <!--
    Security: Content-Security-Policy — restricts scripts to this origin
    (plus Vite's dev-mode inline bootstrap and the Plausible analytics script),
    and locks down frames, media, connections, and fonts to the hosts the site
    actually uses. Mirrors the dev-server policy in vite.config.ts so
    development and production behave identically. X-Frame-Options for the HTML
    document itself is applied by the hosting edge; frame-ancestors 'none' is
    included here for any header-based deployment that picks this policy up.
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.cdnfonts.com; font-src 'self' https://fonts.gstatic.com https://fonts.cdnfonts.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' http: https: ws: wss:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://player.cloudinary.com https://cal.com https://app.cal.com https://calendly.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
  />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Open Graph — proper preview card when shared on WhatsApp, Instagram, etc. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Ebad Ahsan" />
  <meta property="og:title" content="Freelance Video Editor | Short Form & YouTube Content | editsbyebad" />
  <meta
    property="og:description"
    content="Professional video editor specializing in short-form content, YouTube videos, and reels. Fast turnaround, affordable rates. Based in Pakistan."
  />
  <meta property="og:image:alt" content="editsbyebad — Freelance Video Editor" />

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Freelance Video Editor | Short Form & YouTube Content | editsbyebad" />
  <meta
    name="twitter:description"
    content="Professional video editor specializing in short-form content, YouTube videos, and reels. Fast turnaround, affordable rates. Based in Pakistan."
  />
  <meta name="twitter:image" content="/og-image.png" />

  <!-- Resource hints: warm up connections to video hosts/CDNs (thumbnails + embeds) -->
  <link rel="preconnect" href="https://www.youtube.com" />
  <link rel="preconnect" href="https://www.youtube-nocookie.com" />
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin />
  <link rel="preconnect" href="https://player.vimeo.com" />

  <!--
    Visitor analytics — Plausible (privacy-friendly, cookie-less, ~1KB).
    Update data-domain to the site's real production domain (it must match
    the domain you add in the Plausible dashboard). The CSP above already
    whitelists https://plausible.io, so no other config is needed.
  -->
  <script
    defer
    data-domain="editsbyebad.freebuff.app"
    src="https://plausible.io/js/script.js"
  ></script>
  <meta name="google-site-verification" content="yzaAeZgAXqjAXUM_sk2y707HxEhYh2igTpEU20-O8fg" />

  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JSBYJCHYBY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JSBYJCHYBY');
  </script>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
